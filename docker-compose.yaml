version: '3.8'

services:
  app:
    build: .
    container_name: fin_search_app
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/opendata
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FINANCIAL_ASSISTANT_ENCRYPTION_KEY: ${FINANCIAL_ASSISTANT_ENCRYPTION_KEY:-change-this-key-32-bytes-minimum!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pg_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres_opendata
    restart: always
    environment:
      POSTGRES_DB: opendata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opendata"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@exemplo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"  # pgAdmin em localhost:8080
    depends_on:
      - postgres
    networks:
      - pg_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:

networks:
  pg_network:
    driver: bridge
