# Open Finance Brasil — Dados Abertos (opendata): catálogos públicos publicados no Diretório Central.
# Não usam OAuth de utilizador; leitura HTTP conforme especificação de cada família de API.
# Dados do cliente (contas, cartões do utilizador, etc.): requerem participação no ecossistema,
# certificados mTLS, consentimento e scopes — ver https://openfinancebrasil.atlassian.net/wiki/spaces/OF/

server:
  port: 8081

spring:
  application:
    name: data-pump-service
  # Java 21 Virtual Threads — aumenta throughput em operações I/O-bound sem criar threads OS extras.
  threads:
    virtual:
      enabled: true
  # Tarefas agendadas (@Scheduled) desligadas — não há trabalho em segundo plano ao subir a app.
  # Para voltar a sincronizar dados automaticamente: muda para true e reinicia.
  task:
    scheduling:
      enabled: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL
  datasource:
    url: jdbc:postgresql://localhost:5432/opendata
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: healthcheck
      exposure:
        include:
          - info
          - health
          - httptrace
          - env
          - threaddump
          - metrics

open-finance:
  directory:
    participants-url: https://data.directory.openbankingbrasil.org.br/participants
  opendata:
    # Vazio = todas as instituições com opendata. Ex.: [ "Nubank", "Nu" ] para restringir.
    institution-include: []

spring:
  security:
    user:
      name: ${APP_API_USER:admin}
      password: ${APP_API_PASSWORD:change-me-in-production}

financial-assistant:
  security:
    # Trocar em produção por segredo forte gerenciado por cofre de segredos.
    encryption-key: ${FINANCIAL_ASSISTANT_ENCRYPTION_KEY:change-this-key-32-bytes-minimum!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
